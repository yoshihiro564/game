<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>マーブルレース工房</title>
<style>
:root{--bg:#0e1020;--panel:#171a33;--line:#2a2f55;--txt:#e8ebff;--sub:#9aa3c7;--acc:#5cc8ff;--acc2:#ffcf4a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.6 system-ui,-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif}
header{padding:18px 20px 6px}header h1{margin:0;font-size:22px;letter-spacing:.04em}header p{margin:4px 0 0;color:var(--sub);font-size:13px}
.wrap{display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:16px;padding:12px 20px 30px;align-items:start}
@media(max-width:900px){.wrap{grid-template-columns:1fr;padding:10px 12px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}.card h2 small{color:var(--sub);font-weight:500;font-size:12px}
.seg{display:flex;gap:6px;margin-bottom:8px}.seg label{flex:1;text-align:center;background:#0f1230;border:1px solid var(--line);border-radius:9px;padding:6px;cursor:pointer}.seg input{display:none}.seg input:checked+span{color:var(--acc)}.seg label:has(input:checked){border-color:var(--acc)}
#racers{display:flex;flex-wrap:wrap;gap:6px;max-height:220px;overflow:auto}#racers input[type=range]{width:100%}
.chip{display:flex;align-items:center;gap:6px;background:#0f1230;border:1px solid var(--line);color:var(--sub);border-radius:999px;padding:3px 10px 3px 4px;font-size:12px;cursor:pointer}
.chip.on{border-color:var(--acc);color:#fff;background:#14305a}.fl{width:20px;height:20px;border-radius:50%;background-size:cover;background-position:center;display:inline-block}
.stg{display:grid;grid-template-columns:24px 1fr 30px 30px 30px;gap:6px;align-items:center;background:#0f1230;border:1px solid var(--line);border-radius:9px;padding:5px 8px;margin-bottom:5px}
.stg b{color:var(--acc2)}.stg small{display:block;color:var(--sub);font-size:11px}.stg button{background:#1d2148;border:1px solid var(--line);color:var(--txt);border-radius:7px;height:28px;cursor:pointer}
select,input[type=text],input[type=number]{width:100%;background:#0f1230;color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:7px 9px;font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.row label{font-size:12px;color:var(--sub)}
.btn{display:inline-block;background:#1d2148;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
.btn.primary{background:linear-gradient(135deg,#2d7dff,#5cc8ff);border:0;color:#04122a}.btn.gold{background:linear-gradient(135deg,#ffb83d,#ffe17a);border:0;color:#2a1800}.btn:disabled{opacity:.5}
.bar{height:8px;background:#0f1230;border-radius:9px;overflow:hidden;margin:10px 0 4px}#prog{height:100%;width:0;background:linear-gradient(90deg,#2d7dff,#5cc8ff)}#progTxt,.hint{color:var(--sub);font-size:12px;margin:0}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--sub);font-weight:600}tr[data-k]{cursor:pointer}tr.sel{background:#14305a}
.view{position:sticky;top:10px;display:flex;flex-direction:column;align-items:center;gap:10px}
canvas{height:min(74vh,960px);aspect-ratio:9/16;border-radius:14px;border:1px solid var(--line);background:#000;max-width:100%}
@media(max-width:900px){canvas{height:auto;width:100%}}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}#recState{color:var(--acc2);font-size:13px;min-height:20px}
.tb{background:#0f1230;border:1px solid var(--line);border-radius:10px;margin-top:8px}.tbh{display:flex;justify-content:space-between;align-items:center;padding:6px 10px}.tbh h3{margin:0;font-size:13px}.tbh button{background:#1d2148;border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:3px 10px;cursor:pointer}
pre{margin:0;padding:0 10px 10px;white-space:pre-wrap;word-break:break-word;font:12px/1.55 ui-monospace,Consolas,monospace;color:#cfd6ff}
.chk{display:flex;align-items:center;gap:8px;margin-top:8px}
</style></head><body>
<header><h1>🏁 マーブルレース工房</h1><p>出場者とステージを選ぶ → 接戦レースを自動で探す → 動画を書き出す。タイトル・説明文・タグも自動で作ります。</p></header>
<div class="wrap">
<div>
 <div class="card"><h2>① 出場者 <small id="racerCount"></small></h2>
  <div class="seg"><label><input type="radio" name="mode" value="country" checked><span>国旗</span></label><label><input type="radio" name="mode" value="color"><span>色</span></label></div>
  <div id="racers"></div></div>
 <div class="card"><h2>② ステージ <small id="stageInfo"></small></h2>
  <div id="stages"></div>
  <div class="row"><select id="addStage"></select><button class="btn" id="shuffle">🎲 おまかせ構成</button></div>
  <label class="chk"><input type="checkbox" id="elim"> 脱落制（ステージごとに最下位が脱落、最後は3人で決勝）</label></div>
 <div class="card"><h2>③ 見た目</h2>
  <div class="row"><div><label>テーマ</label><select id="theme"></select></div><div><label>画面上の見出し</label><input type="text" id="title" value="Which country wins?"></div></div></div>
 <div class="card"><h2>④ レースを探す</h2>
  <div class="row"><div><label>試走回数</label><input type="number" id="trials" value="60" min="10" max="400"></div><div><label>動画の最大の長さ（秒）</label><input type="number" id="maxLen" value="58" min="20" max="600"></div></div>
  <div class="row"><div><label>選び方</label><select id="prefer"><option value="close">接戦重視（ゴール差が小さい）</option><option value="swing">逆転重視（首位交代が多い）</option></select></div><div style="display:flex;align-items:end"><button class="btn primary" id="btnSearch" style="width:100%">🔍 レースを探す</button></div></div>
  <div class="bar"><div id="prog"></div></div><p id="progTxt">Shortsは60秒以内がおすすめ。長いときはステージを減らすか脱落制に。</p>
  <div id="cands"></div></div>
 <div class="card"><h2>⑤ 投稿用テキスト <small>英語・海外向け</small></h2><div id="textOut"><p class="hint">レースを選ぶと自動で作成されます。</p></div></div>
</div>
<div class="view">
 <canvas id="cv" width="1080" height="1920"></canvas>
 <div class="ctrls"><button class="btn" id="btnPlay">▶ プレビュー</button><button class="btn" id="btnStop">■ 停止</button><button class="btn gold" id="btnRec">⏺ 動画を書き出す</button><label class="chk" style="margin:0"><input type="checkbox" id="mute"> 消音</label></div>
 <div id="recState"></div><div id="dl"></div>
 <p class="hint" style="max-width:520px;text-align:center">書き出しは実際の再生時間ぶんかかります（約1分）。録画中はこのタブを前面に。Chrome/Edgeは.webm（そのままYouTubeに投稿可）、Safariは.mp4で保存されます。</p>
</div></div>
<script>// ===== core: course + physics (no DOM) =====
const MR = (() => {
const R = 22, G = 1500, VMAX = 1300, XL = 20, XR = 1060;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function newCourse(){return {segs:[],circ:[],mills:[],pends:[],rings:[],gates:[],portals:[],stages:[],fin:0,floor:0};}
function seg(c,ax,ay,bx,by,kind='ramp',e=0.35,mu=0.01){c.segs.push({ax,ay,bx,by,kind,e,mu,y0:Math.min(ay,by)-60,y1:Math.max(ay,by)+60});}
function funnel(c,y,cx=540,w=70,h=150){seg(c,XL,y,cx-w,y+h);seg(c,XR,y,cx+w,y+h);return y+h;}
function zig(c,y,n,drop=300,gap=150,inset=170){for(let k=0;k<n;k++){if(k%2==0)seg(c,XL,y,XR-inset,y+drop);else seg(c,XR,y,XL+inset,y+drop);y+=drop+gap;}return y;}
function pegs(c,y,h,sp=120,r=13,dy=115){let row=0;const y0=y;while(y<y0+h){let x=100+(row%2==0?0:sp/2);while(x<=985){c.circ.push({x,y,r,kind:'peg',kick:0});x+=sp;}y+=dy;row++;}return y;}
const D2R=Math.PI/180;
const STAGES={
 bumpers:{jp:'ピンボールバンパー',en:'PINBALL BUMPERS',build(c,y){y+=20;const rows=[[200,420,660,880],[310,540,770],[200,420,660,880],[310,540,770]];rows.forEach((xs,k)=>xs.forEach(x=>c.circ.push({x,y:y+60+k*190,r:34,kind:'bumper',kick:620})));return funnel(c,y+60+4*190,540,75,170);}},
 drum:{jp:'回転ドラム',en:'SPIN DRUM',build(c,y){y+=40;const Rr=250,cy=y+60+Rr;c.rings.push({x:540,y:cy,R:Rr,gap:88*D2R,om:1.5,ph:-90*D2R,th:10});const a=24*D2R,wx=Rr*Math.sin(a),wy=cy-Rr*Math.cos(a);seg(c,540-wx,y-20,540-wx,wy-4,'wall');seg(c,540+wx,y-20,540+wx,wy-4,'wall');seg(c,XL,cy-40,460,cy+Rr+170);seg(c,XR,cy-40,620,cy+Rr+170);return cy+Rr+170;}},
 pendulums:{jp:'振り子',en:'PENDULUMS',build(c,y){y+=60;for(let k=0;k<3;k++){c.pends.push({x:540,y:y+k*420,L:330,amp:68*D2R,w:2.3,ph:k*2.1,bob:42});for(const x of (k%2==0?[180,900]:[120,960]))c.circ.push({x,y:y+k*420+250,r:16,kind:'peg',kick:0});}y+=3*420+40;return funnel(c,y,540,70,180);}},
 wheel:{jp:'水車',en:'PADDLE WHEEL',build(c,y){y+=40;y=funnel(c,y,360,70,160)+40;const cy=y+250;c.mills.push({x:540,y:cy,L:230,om:-1.25,ph:0.3,arms:6,th:9,full:false});seg(c,XL,cy+150,470,cy+420);seg(c,XR,cy+150,610,cy+420);return cy+420;}},
 gate:{jp:'時限ゲート',en:'TIMED GATE',build(c,y){y+=40;y=funnel(c,y,540,75,200);c.gates.push({ax:465,ay:y,bx:615,by:y,period:2.6,open:0.7,ph:0});return y+120;}},
 trampolines:{jp:'トランポリン',en:'TRAMPOLINES',build(c,y){const b=y-80;seg(c,420,b+330,660,b+250,'pad',1.0);seg(c,40,b+520,300,b+620,'pad',1.0);seg(c,780,b+700,1040,b+600,'pad',1.0);c.circ.push({x:540,y:b+560,r:30,kind:'bumper',kick:600});return funnel(c,b+820,540,75,170);}},
 portals:{jp:'ワープ',en:'LUCKY PORTALS',build(c,y){y+=60;const y0=y;const start=c.circ.length;y=pegs(c,y,950,140,14,125);const ey=y+40;c.portals.push({x:230,y:y0+310,r:34,tx:540,ty:ey+20});c.portals.push({x:850,y:y0+560,r:34,tx:540,ty:ey+20});const keep=c.circ.slice(0,start).concat(c.circ.slice(start).filter(p=>!c.portals.slice(-2).some(q=>Math.hypot(p.x-q.x,p.y-q.y)<70)));c.circ=keep;return funnel(c,ey,540,75,170);}},
 twindrums:{jp:'ツインドラム',en:'TWIN DRUMS',build(c,y){y+=60;c.circ.push({x:540,y:y+20,r:26,kind:'bumper',kick:450});seg(c,540,y+60,540,y+260,'wall');const Rr=190,cy=y+420+Rr,a=26*D2R,wx=Rr*Math.sin(a),wy=cy-Rr*Math.cos(a);
   for(const [cx,om] of [[290,1.9],[790,-1.4]]){c.rings.push({x:cx,y:cy,R:Rr,gap:95*D2R,om,ph:-70*D2R,th:10});
     if(cx<540){seg(c,cx-wx,y+215,cx-wx,wy-4,'wall');seg(c,cx+wx,y+330,cx+wx,wy-4,'wall');}else{seg(c,cx-wx,y+330,cx-wx,wy-4,'wall');seg(c,cx+wx,y+215,cx+wx,wy-4,'wall');}}
   seg(c,XL,y+120,290-wx+45,y+190);seg(c,XR,y+120,790+wx-45,y+190);seg(c,540,y+260,290+wx-45,y+305);seg(c,540,y+260,790-wx+45,y+305);
   seg(c,XL,cy+40,480,cy+Rr+220);seg(c,XR,cy+40,600,cy+Rr+220);return cy+Rr+220;}},
 windmills:{jp:'風車',en:'WINDMILLS',build(c,y){y+=80;c.mills.push({x:310,y:y+180,L:170,om:2.6,ph:0,arms:3,th:12,full:true});c.mills.push({x:770,y:y+180,L:170,om:-2.6,ph:0.5,arms:3,th:12,full:true});c.mills.push({x:540,y:y+520,L:200,om:2.2,ph:0.2,arms:4,th:12,full:true});y+=700;return funnel(c,y,540,90,180);}},
 pegs:{jp:'ピンの森',en:'PEG FOREST',build(c,y){y+=60;y=pegs(c,y,1000);return funnel(c,y,540,90,180);}},
 split:{jp:'左右分岐',en:'LEFT OR RIGHT?',build(c,y){y+=60;c.circ.push({x:540,y:y-10,r:18,kind:'peg',kick:0});seg(c,540,y,540,y+1250,'wall');let yl=y+120;for(let k=0;k<4;k++){if(k%2==0)seg(c,XL,yl,420,yl+170);else seg(c,540,yl,140,yl+170);yl+=290;}
   for(let yr=y+150;yr<y+1150;yr+=150){const xs=(Math.floor((yr-y)/150)%2==0)?[630,750,870,975]:[690,810,930];for(const x of xs)c.circ.push({x,y:yr,r:15,kind:'peg',kick:0});}return funnel(c,y+1250,540,90,170);}},
 zigzag:{jp:'ジグザグ',en:'ZIGZAG',build(c,y){y+=40;y=zig(c,y,4);return funnel(c,y,540,90,150);}},
 steep:{jp:'急降下',en:'STEEP DROP',build(c,y){y+=40;y=zig(c,y,3,380,170,230);return funnel(c,y,540,90,150);}},
};
function buildCourse(ids){
  const c=newCourse();seg(c,XL,-800,XL,60000,'wall');seg(c,XR,-800,XR,60000,'wall');
  seg(c,XL,300,470,420);seg(c,XR,300,610,420);c.gates.push({ax:470,ay:420,bx:610,by:420,start:0.6});
  let y=420;
  for(const id of ids){const st=STAGES[id];c.stages.push({y:y+60,id,name:st.en});y=st.build(c,y+40);}
  y+=60;seg(c,440,y,440,y+240,'wall');seg(c,640,y,640,y+240,'wall');c.fin=y+300;c.floor=y+540;seg(c,XL,c.floor,XR,c.floor,'floor',0.2);
  return c;
}
function closest(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy;let t=((px-ax)*dx+(py-ay)*dy)/L2;t=t<0?0:t>1?1:t;return [ax+t*dx,ay+t*dy];}
class Race{
  constructor(course,n,seed,elim){
    this.c=course;this.n=n;this.rng=mulberry32(seed*7919+13);this.elim=!!elim;
    const order=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(this.rng()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
    this.m=order.map((i,slot)=>{const row=Math.floor(slot/4),col=slot%4;return {i,x:150+col*120+(row%2?60:0)+(this.rng()-0.5)*16,y:[150,220,80][row]??80,vx:0,vy:0,a:this.rng()*6.28,fin:null,out:false,outOrder:0,tp:0};});
    this.t=0;this.order=[];this.ev=[];this.stageSeen=0;this.outCount=0;this.minAlive=n>=4?3:n;
  }
  gateClosed(g){if(g.start!==undefined)return this.t<g.start;return ((this.t+g.ph)%g.period)>g.open;}
  contact(m,cx,cy,rad,svx=0,svy=0,e=0.35,mu=0.01,kind='ramp',kick=0){
    const dx=m.x-cx,dy=m.y-cy,d=Math.hypot(dx,dy);if(!(d>1e-6&&d<rad))return false;
    const nx=dx/d,ny=dy/d;m.x=cx+nx*rad;m.y=cy+ny*rad;let rvx=m.vx-svx,rvy=m.vy-svy;const vn=rvx*nx+rvy*ny;
    if(vn<0){
      if(kind==='pad'){const out=Math.max(-vn,950);rvx+=(-vn+out)*nx;rvy+=(-vn+out)*ny;}
      else if(kind==='bumper'){rvx-=vn*nx;rvy-=vn*ny;rvx+=nx*kick;rvy+=ny*kick;}
      else{rvx-=(1+e)*vn*nx;rvy-=(1+e)*vn*ny;}
      const tx=-ny,ty=nx,vt=rvx*tx+rvy*ty;rvx-=vt*tx*mu;rvy-=vt*ty*mu;m.vx=rvx+svx;m.vy=rvy+svy;
      if(-vn>220||kind==='pad'||kind==='bumper')this.ev.push({k:kind,v:-vn,x:cx,y:cy});
    }
    return true;
  }
  step(dt){
    const c=this.c;this.t+=dt;const t=this.t;
    if(Math.abs(t-0.6)<dt/2+1e-9)this.ev.push({k:'go'});
    const dyn=[];
    for(const mi of c.mills)for(let k=0;k<mi.arms;k++){const a=mi.ph+mi.om*t+k*2*Math.PI/mi.arms,ux=Math.cos(a)*mi.L,uy=Math.sin(a)*mi.L;
      dyn.push([mi.full?mi.x-ux:mi.x,mi.full?mi.y-uy:mi.y,mi.x+ux,mi.y+uy,mi.x,mi.y,mi.om,mi.th,mi.y-mi.L-50,mi.y+mi.L+50]);}
    for(const p of c.pends){const th=p.amp*Math.sin(p.w*t+p.ph),om=p.amp*p.w*Math.cos(p.w*t+p.ph);p.bx=p.x+p.L*Math.sin(th);p.by=p.y+p.L*Math.cos(th);p.om_=om;
      dyn.push([p.x,p.y,p.bx,p.by,p.x,p.y,-om,10,p.y-40,p.y+p.L+80]);}
    const act=this.m.filter(m=>!m.out);
    for(const m of act){m.vy+=G*dt;m.x+=m.vx*dt;m.y+=m.vy*dt;}
    for(const m of act){
      const y=m.y;
      for(const s of c.segs){if(y<s.y0||y>s.y1)continue;const [cx,cy]=closest(m.x,m.y,s.ax,s.ay,s.bx,s.by);this.contact(m,cx,cy,R+4,0,0,s.e,s.mu,s.kind);}
      for(const g of c.gates){if(this.gateClosed(g)&&Math.abs(y-g.ay)<60){const [cx,cy]=closest(m.x,m.y,g.ax,g.ay,g.bx,g.by);this.contact(m,cx,cy,R+4);}}
      for(const q of c.circ){if(Math.abs(y-q.y)>70)continue;this.contact(m,q.x,q.y,q.r+R,0,0,0.5,0.01,q.kind,q.kick);}
      for(const d of dyn){if(y<d[8]||y>d[9])continue;const [cx,cy]=closest(m.x,m.y,d[0],d[1],d[2],d[3]);const rx=cx-d[4],ry=cy-d[5];this.contact(m,cx,cy,R+d[7],-d[6]*ry,d[6]*rx,0.4,0.05,'mill');}
      for(const p of c.pends){if(Math.abs(y-p.by)<120){const rx=p.bx-p.x,ry=p.by-p.y,om=-p.om_;this.contact(m,p.bx,p.by,R+p.bob,-om*ry,om*rx,0.6,0.01,'pend');}}
      for(const rg of c.rings){const dx=m.x-rg.x,dy=m.y-rg.y,d=Math.hypot(dx,dy);if(Math.abs(d-rg.R)>R+rg.th+2)continue;
        const ang=Math.atan2(dy,dx),gc=rg.ph+rg.om*t;let rel=((ang-gc+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;
        if(Math.abs(rel)<rg.gap/2){for(const sg of [-1,1]){const ea=gc+sg*rg.gap/2,ex=rg.x+rg.R*Math.cos(ea),ey=rg.y+rg.R*Math.sin(ea);this.contact(m,ex,ey,R+rg.th,-rg.om*(ey-rg.y),rg.om*(ex-rg.x),0.4,0.01,'ring');}continue;}
        const cx=rg.x+dx/d*rg.R,cy=rg.y+dy/d*rg.R;this.contact(m,cx,cy,R+rg.th,-rg.om*(cy-rg.y),rg.om*(cx-rg.x),0.3,0.004,'ring');}
      for(const p of c.portals){if(Math.hypot(m.x-p.x,m.y-p.y)<p.r){m.x=p.tx+(this.rng()-0.5)*40;m.y=p.ty;m.vx=(this.rng()-0.5)*160;m.vy=150;m.tp=1;this.ev.push({k:'portal',x:p.x,y:p.y,i:m.i});}}
    }
    for(let a=0;a<act.length;a++)for(let b=a+1;b<act.length;b++){const A=act[a],B=act[b];const dx=B.x-A.x,dy=B.y-A.y;if(Math.abs(dx)>2*R||Math.abs(dy)>2*R)continue;const d=Math.hypot(dx,dy);
      if(d>1e-6&&d<2*R){const nx=dx/d,ny=dy/d,o=(2*R-d)/2;A.x-=nx*o;A.y-=ny*o;B.x+=nx*o;B.y+=ny*o;const rv=(B.vx-A.vx)*nx+(B.vy-A.vy)*ny;

const AU={ctx:null,dest:null,master:null,
 init(){if(this.ctx)return;this.ctx=new (window.AudioContext||window.webkitAudioContext)();this.master=this.ctx.createGain();this.master.gain.value=0.6;this.master.connect(this.ctx.destination);this.dest=this.ctx.createMediaStreamDestination();this.master.connect(this.dest);
   const len=this.ctx.sampleRate;const b=this.ctx.createBuffer(1,len,len);const d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;this.noiseBuf=b;},
 tone(f,dur,amp,dec=10,type='sine',delay=0){const c=this.ctx,t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(amp,t);g.gain.exponentialRampToValueAtTime(0.0001,t+Math.max(0.03,Math.min(dur,4/dec)));o.connect(g).connect(this.master);o.start(t);o.stop(t+dur+0.05);},
 noise(dur,amp,freq=2000,delay=0){const c=this.ctx,t=c.currentTime+delay,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=this.noiseBuf;f.type='lowpass';f.frequency.value=freq;g.gain.setValueAtTime(amp,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(f).connect(g).connect(this.master);s.start(t,Math.random()*0.5);s.stop(t+dur+0.02);},
 play(evs){if(!this.ctx||this.muted)return;const cnt={};for(const e of evs){cnt[e.k]=(cnt[e.k]||0)+1;if(cnt[e.k]>3)continue;const a=Math.min(1,Math.max(0.3,(e.v||600)/900));
   switch(e.k){case'clack':this.tone(2400+Math.random()*600,0.05,0.25*a,60,'triangle');break;
    case'ramp':case'wall':case'floor':this.noise(0.06,0.25*a,900);break;
    case'peg':this.tone(1600+Math.random()*800,0.07,0.16*a,40);break;
    case'bumper':this.tone(700+Math.floor(Math.random()*3)*120,0.16,0.22,14,'triangle');this.noise(0.04,0.15,4000);break;
    case'pad':this.tone(300,0.25,0.28,8,'triangle');this.tone(600,0.2,0.18,10,'sine',0.02);break;
    case'mill':case'ring':this.noise(0.08,0.3*a,1200);this.tone(150,0.08,0.18*a,30);break;
    case'pend':this.tone(110,0.25,0.35,10,'triangle');this.noise(0.1,0.3,1500);break;
    case'portal':for(let j=0;j<4;j++)this.tone(500+j*250,0.2,0.15,12,'sine',j*0.03);break;
    case'go':this.tone(880,0.4,0.3,6,'square');break;
    case'stage':this.tone(659.25,0.25,0.15,10,'triangle');this.tone(987.77,0.4,0.15,8,'triangle',0.11);break;
    case'elim':this.tone(330,0.3,0.25,8,'sawtooth');this.tone(220,0.4,0.25,6,'sawtooth',0.12);break;
    case'finish':if(e.v===1){[523.25,659.25,783.99,1046.5].forEach((f,j)=>this.tone(f,1.2,0.18,3,'triangle',j*0.06));this.noise(2.2,0.35,1200,0.05);}else this.tone(e.v<=3?1046.5:784,0.35,0.14,8,'triangle');break;}}}
};

   const [up,dn,rm]=d.querySelectorAll('button');up.onclick=()=>{if(k>0){[ST.stages[k-1],ST.stages[k]]=[ST.stages[k],ST.stages[k-1]];renderStageUI();invalidate();}};
   dn.onclick=()=>{if(k<ST.stages.length-1){[ST.stages[k+1],ST.stages[k]]=[ST.stages[k],ST.stages[k+1]];renderStageUI();invalidate();}};
   rm.onclick=()=>{if(ST.stages.length>1){ST.stages.splice(k,1);renderStageUI();invalidate();}};box.appendChild(d);});
 const add=$('#addStage');add.innerHTML='<option value="">＋ ステージを追加…</option>'+ALL_STAGES.map(id=>`<option value="${id}">${MR.STAGES[id].jp}（${MR.STAGES[id].en}）</option>`).join('');
 $('#stageInfo').textContent=`${ST.stages.length} ステージ`;}
function invalidate(){ST.chosen=null;ST.results=[];$('#cands').innerHTML='<p class="hint">設定を変えたので、もう一度「レースを探す」を押してください。</p>';$('#textOut').innerHTML='';drawStill();}
// --- search ---
let searching=false;
async function search(){if(searching)return;const rs=racers();if(rs.length<2){alert('出場者を2つ以上選んでください');return;}
 searching=true;const btn=$('#btnSearch');btn.disabled=true;const c=course();const N=ST.trials,maxT=ST.maxLen-3;const base=Math.floor(Math.random()*1e6);const out=[];
 for(let k=0;k<N;k++){const r=MR.simulate(c,rs.length,base+k,ST.elim,maxT);if(r.done)out.push(r);
   $('#prog').style.width=`${(k+1)/N*100}%`;$('#progTxt').textContent=`${k+1} / ${N} レース試走（成立 ${out.length}）`;if(k%2==1)await new Promise(res=>setTimeout(res,0));}
 const score=r=>ST.prefer==='close'?(-r.gap*20+r.changes*0.5):(r.changes*2-r.gap*4);
 out.sort((a,b)=>score(b)-score(a));ST.results=out.slice(0,10);searching=false;btn.disabled=false;showCands();if(ST.results.length)choose(0);else $('#cands').innerHTML='<p class="hint">条件内で完走するレースが見つかりませんでした。ステージを減らすか、最大の長さを延ばしてください。</p>';}
function showCands(){const rs=racers();$('#cands').innerHTML=`<table><thead><tr><th>#</th><th>優勝</th><th>2位との差</th><th>首位交代</th><th>動画の長さ</th></tr></thead><tbody>${ST.results.map((r,k)=>`<tr data-k="${k}" class="${ST.chosen===r?'sel':''}"><td>${k+1}</td><td>${rs[r.order[0]].emoji||''} ${rs[r.order[0]].name}</td><td>${r.gap.toFixed(2)}秒</td><td>${r.changes}回</td><td>${(r.T+3).toFixed(0)}秒</td></tr>`).join('')}</tbody></table>`;
 $('#cands').querySelectorAll('tr[data-k]').forEach(tr=>tr.onclick=()=>choose(+tr.dataset.k));}
function choose(k){ST.chosen=ST.results[k];showCands();genText();drawStill();}
// --- text generation ---
const cap=s=>s.charAt(0)+s.slice(1).toLowerCase();
function genText(){const r=ST.chosen,rs=racers();if(!r)return;const w=rs[r.order[0]],s2=rs[r.order[1]];const isC=ST.mode==='country';const nm=x=>isC?cap(x.name==='USA'?'USA':x.name==='UK'?'UK':x.name):cap(x.name);
 const nmx=x=>(x.name==='USA'||x.name==='UK')?x.name:nm(x);
 const ems=rs.map(x=>x.emoji).join('');const stg=ST.stages.map(id=>MR.STAGES[id].en.toLowerCase());
 const hl=ST.stages.slice(0,4).map(id=>({bumpers:'bumpers',drum:'spin drums',pendulums:'pendulums',wheel:'a paddle wheel',gate:'a timed gate',trampolines:'trampolines',portals:'lucky portals',twindrums:'twin drums',windmills:'windmills',pegs:'a peg forest',split:'split paths',zigzag:'zigzags',steep:'steep drops'}[id]));
 const subj=isC?'country':'color';
 const title=`${ST.stages.length}-stage marble race${ST.elim?' (elimination)':''} — which ${subj} wins? ${isC?'🌍':'🎨'} #shorts #marblerace`;
 const desc=`${rs.length} ${isC?'countries':'marbles'}. ${ST.stages.length} stages. Only 1 winner.\n${(t=>t.charAt(0).toUpperCase()+t.slice(1))(hl.join(', '))}${ST.elim?' — and the last place is eliminated every stage!':'…'}\nPick your ${subj} BEFORE it starts 👇\n${ems}\n\nWhich ${subj} should join the next race? Comment below!\n\n#shorts #marblerace #marblerun ${isC?'#countryballs ':''}#satisfying #simulation`;
 const tags=['marble race','marble run',isC?'country marble race':'color marble race',`which ${subj} wins`,isC?'flag race':'color race',isC?'countries race':'marble race colors',...(ST.elim?['elimination marble race']:[]),...stg.slice(0,3).map(s=>'marble race '+s),...rs.slice(0,6).map(x=>nmx(x).toLowerCase()),'satisfying','simulation','shorts'];
 const pin=`${w.emoji||''} ${nmx(w)} won by ${r.gap.toFixed(2)}s over ${s2.emoji||''} ${nmx(s2)}${r.changes>=5?` — the lead changed ${r.changes} times 😱`:' 😱'}\nWhich stage was the craziest? 👇\nMost requested ${subj} joins the next race!`;
 const blocks=[['タイトル',title],['説明文',desc],['タグ',[...new Set(tags)].join(', ')],['固定コメント',pin]];
 $('#textOut').innerHTML=blocks.map(([h,b],k)=>`<div class="tb"><div class="tbh"><h3>${h}</h3><button data-k="${k}">コピー</button></div><pre>${b.replace(/</g,'&lt;')}</pre></div>`).join('')+`<div class="tb"><div class="tbh"><h3>Markdown一式</h3><button data-k="all">コピー</button></div></div>`;

// --- playback / recording ---
const cv=$('#cv'),g=cv.getContext('2d');let play=null;
function newSession(seed){const c=course();return {c,race:new MR.Race(c,racers().length,seed,ST.elim),cam:-330,fi:0,pops:[],stage:null,stageF:0,elim:null,elimF:0,winF:null,resF:null};}
function frame(P){const {race,c}=P;const rs=racers();
 if(P.resF===null){for(let k=0;k<MR.SUB;k++)race.step(MR.DT);const ev=race.ev.splice(0);AU.play(ev);
   for(const e of ev){if(e.k==='bumper'){const q=c.circ.find(q=>q.x===e.x&&q.y===e.y);if(q)q.flash=1;}
     if(e.k==='stage'){P.stage=`STAGE ${e.si+1}: ${e.name}`;P.stageF=P.fi;}
     if(e.k==='elim'){P.elim=`${rs[e.i].name} ELIMINATED!`;P.elimF=P.fi;P.pops.push({x:e.x,y:e.y,life:1});}
     if(e.k==='finish'&&e.v===1)P.winF=P.fi;}
   for(const q of c.circ)if(q.flash)q.flash=Math.max(0,q.flash-0.15);
   const live=race.m.filter(m=>!m.out&&m.fin===null);const lead=live.length?Math.max(...live.map(m=>m.y)):c.floor;
   let tgt=race.order.length?c.floor+80-H:lead-1150;tgt=Math.max(-330,Math.min(tgt,c.floor+80-H));P.cam+=(tgt-P.cam)*0.12;
   if(race.done())P.resF=P.fi;}
 for(const p of P.pops)p.life-=0.04;P.pops=P.pops.filter(p=>p.life>0);
 const ov={};if(P.fi>=18&&P.fi<40)ov.go=1;if(P.stage&&P.fi-P.stageF<45)ov.stage=P.stage;if(P.elim&&P.fi-P.elimF<40)ov.elim=P.elim;
 if(P.winF!==null&&P.fi-P.winF<75&&P.resF===null){const wi=race.order[0],w=rs[wi];const fm={};race.m.forEach(m=>fm[m.i]=m.fin);ov.win={text:`${w.name} WINS!`,col:w.main,sub:race.order.length>1?`by ${(fm[race.order[1]]-fm[wi]).toFixed(2)}s!`:''};}
 if(P.resF!==null){const rk=race.ranking();ov.results=rk.map(i=>{const m=race.m.find(mm=>mm.i===i);return {i,out:m.out,stage:m.outStage,time:(m.fin||0)-0.6};});ov.results.cta=ST.mode==='country'?'Did your country win? Comment below':'Did your color win? Comment below';}
 render(g,{race,course:c,racers:rs,cam:P.cam,theme:THEMES[ST.theme],fi:P.fi,overlay:ov,pops:P.pops,title:ST.title,subtitle:subtitle()});

function start(record){if(!ST.chosen){alert('先に「レースを探す」で候補を選んでください');return;}stop();AU.init();AU.ctx.resume();const P=newSession(ST.chosen.seed);let rec=null,chunks=[];
 if(record){const vs=cv.captureStream(30);const tr=[...vs.getVideoTracks(),...AU.dest.stream.getAudioTracks()];const ms=new MediaStream(tr);
   const types=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];const mime=types.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||'';
   rec=new MediaRecorder(ms,{mimeType:mime,videoBitsPerSecond:10_000_000});rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
   rec.onstop=()=>{const type=rec.mimeType||mime||'video/webm';const blob=new Blob(chunks,{type});const ext=type.includes('mp4')?'mp4':'webm';const url=URL.createObjectURL(blob);
     const name=`marble_race_${ST.chosen.seed}.${ext}`;$('#dl').innerHTML=`<a class="btn primary" href="${url}" download="${name}">⬇ ${name} を保存（${(blob.size/1e6).toFixed(1)}MB）</a>`;};
   rec.start(1000);$('#recState').textContent='● 録画中… このタブを表示したままお待ちください';}
 let last=performance.now(),acc=0;play={raf:0,rec};
 const loop=now=>{acc+=Math.min(0.25,(now-last)/1000);last=now;let done=false;while(acc>=1/30&&!done){acc-=1/30;done=frame(P);if(record)break;}
   if(done){if(rec){rec.stop();$('#recState').textContent='✓ 書き出し完了';}play=null;return;}play.raf=requestAnimationFrame(loop);};
 play.raf=requestAnimationFrame(loop);}
function stop(){if(play){cancelAnimationFrame(play.raf);if(play.rec&&play.rec.state!=='inactive'){play.rec.stop();$('#recState').textContent='録画を中断しました';}play=null;}}

function wire(){
